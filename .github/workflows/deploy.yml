name: Deploy CyberBodha to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-and-deploy:
    name: Validate, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type checking
        run: bun x tsc --noEmit

      - name: Run automated test suite
        run: bun run test

      - name: Build production application
        run: bun run build
        env:
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
          VITE_FACEBOOK_DOMAIN_VERIFICATION: ${{ vars.VITE_FACEBOOK_DOMAIN_VERIFICATION }}

      - name: Verify Cloudflare deployment artifacts
        run: |
          test -f .output/server/index.mjs || { echo "Missing .output/server/index.mjs"; exit 1; }
          test -f .output/server/wrangler.json || { echo "Missing .output/server/wrangler.json"; exit 1; }
          test -d .output/public || { echo "Missing .output/public directory"; exit 1; }
          test -f wrangler.jsonc || { echo "Missing wrangler.jsonc"; exit 1; }
          echo "Verified Cloudflare deployment artifacts successfully."

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-build
          path: |
            .output/
            .wrangler/
            wrangler.jsonc
          retention-days: 1

      - name: Verify Cloudflare secrets presence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is empty or not configured!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is empty or not configured!"
            exit 1
          fi
          echo "Cloudflare deployment secrets are configured."

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "latest"
          command: deploy

      - name: Print deployment error log on failure
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "=== Wrangler stdout ==="
          echo "${{ steps.deploy.outputs.command-output }}"
          echo "=== Wrangler stderr ==="
          echo "${{ steps.deploy.outputs.command-stderr }}"

      - name: Post-deployment HTTP health check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "Waiting 15s for edge propagation..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cyberbodha.com)
          echo "Production apex endpoint returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed: expected HTTP 200, got $STATUS"
            exit 1
          fi
          CEH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cyberbodha.com/courses/ceh-v13-ai-ethical-hacking)
          echo "CEH course endpoint returned HTTP $CEH_STATUS"
          if [ "$CEH_STATUS" -ne 200 ]; then
            echo "Health check failed: expected HTTP 200 for CEH course, got $CEH_STATUS"
            exit 1
          fi
          echo "Post-deployment health checks passed successfully."
